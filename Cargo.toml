[package]
name = "onyx-dl"
version = "0.1.0"
edition = "2021"
authors = ["ONYX Team"]
description = "The Ultimate YouTube Downloader - A beautiful TUI application"
license = "MIT"
repository = "https://github.com/sethunthunder111/onyx"
homepage = "https://github.com/sethunthunder111/onyx"
readme = "README.md"
keywords = ["youtube", "downloader", "tui", "video", "yt-dlp"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "onyx"
path = "src/main.rs"

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error Handling
anyhow = "1"

# Platform-specific directories
dirs = "5"

# For regex parsing
regex = "1"

# Web Server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
rust-embed = "8"
mime_guess = "2"

# UUID for download tracking
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
